<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAVO LINE 會員後台</title>
<style>
:root{--pink:#c96f91;--ink:#332a30;--muted:#847780;--line:#f0dce5;--green:#4d8c75}*{box-sizing:border-box}body{margin:0;background:#fff7fa;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0}.logo{letter-spacing:.25em;color:var(--pink);font-weight:800;font-size:12px}h1{font-size:23px;margin:8px 0}h2{font-size:18px;margin:0 0 14px}p,.muted{font-size:13px;color:var(--muted);line-height:1.6}label{display:block;font-size:14px;font-weight:700;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink);margin:0 0 8px}select[multiple]{min-height:190px}textarea{resize:vertical}button{padding:13px 15px;border:0;border-radius:11px;background:var(--pink);color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.primary{width:100%}.secondary{background:#eee;color:#333}.green{background:var(--green)}.hidden{display:none!important}.msg{white-space:pre-wrap;color:var(--muted);font-size:13px;line-height:1.6;margin-top:10px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{background:#fff4f8;border-radius:10px;padding:12px;font-size:13px;color:#81566a;line-height:1.6}.result{background:#f2faf6;border:1px solid #d4eadf;padding:14px;border-radius:12px;margin-top:12px}.result ul{margin:8px 0;padding-left:20px}.mode{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0}.mode label{display:flex;align-items:center;gap:6px;margin:0;font-weight:500}.mode input{width:auto;margin:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}@media(max-width:520px){.grid{grid-template-columns:1fr}.card{padding:16px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
</head>
<body><main class="wrap"><div class="logo">N A V O</div><h1>LINE 會員管理後台</h1><p>管理會員綁定驗證碼與抵用券。發券操作會由伺服器再次驗證指定管理員身分。</p>
<section id="loginCard" class="card"><h2>管理員登入</h2><label for="email">Email</label><input id="email" type="email" autocomplete="username"><label for="password">密碼</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="primary">使用 NAVO 管理員帳號登入</button><div id="loginMsg" class="msg"></div></section>
<section id="toolCard" class="hidden">
<div class="card"><div class="topbar"><h2>會員綁定驗證碼</h2><button id="logoutBtn" class="secondary">登出</button></div><label for="customerCode">選擇 NAVO 客戶</label><select id="customerCode"><option value="">載入客戶中⋯</option></select><button id="makeBtn" class="primary">產生 15 分鐘有效驗證碼</button><div id="codeResult" class="result hidden"><p>請將以下驗證碼私訊給對應客戶，勿公開分享。</p><div id="code" style="font-size:30px;letter-spacing:.18em;font-weight:900;text-align:center;padding:12px"></div><p id="expiry"></p><button id="copyBtn" class="green primary">複製驗證碼</button></div><div id="toolMsg" class="msg"></div></div>
<div class="card"><h2>新增抵用券</h2><div class="hint">抵用券會直接出現在所選會員的 LINE 會員中心。全體會員會依目前 CRM customers 客戶清單發券；未綁定 LINE 的客戶也會先建立抵用券，綁定後即可看到。</div>
<label>發券對象</label><div class="mode"><label><input type="radio" name="targetMode" value="one" checked>單一會員</label><label><input type="radio" name="targetMode" value="multiple">多位會員</label><label><input type="radio" name="targetMode" value="all">全體會員</label></div>
<div id="singleWrap"><label for="couponCustomer">選擇會員</label><select id="couponCustomer"><option value="">載入客戶中⋯</option></select></div>
<div id="multipleWrap" class="hidden"><label for="couponCustomers">選擇多位會員（可按住 Ctrl／⌘ 多選）</label><select id="couponCustomers" multiple></select><p class="muted">電腦可按住 Ctrl（Mac 按 ⌘）點選多位會員。</p></div>
<div id="allWrap" class="hidden"><p id="allCount" class="hint">將發送給目前客戶清單中的所有客戶。</p></div>
<label for="couponTitle">抵用券名稱</label><input id="couponTitle" maxlength="100" value="NAVO 會員專屬抵用券" placeholder="例如：會員回饋抵用券">
<div class="grid"><div><label for="couponAmount">折抵金額（NT$）</label><input id="couponAmount" type="number" min="1" step="1" value="100"></div><div><label for="couponMinimum">最低消費（NT$）</label><input id="couponMinimum" type="number" min="0" step="1" value="1000"></div></div>
<label for="couponExpiry">使用期限（選填）</label><input id="couponExpiry" type="date"><p class="muted">不設定到期日代表不自動到期。設定到期日後，當日台灣時間 23:59:59 前有效。</p>
<label for="couponNote">使用說明（選填）</label><textarea id="couponNote" rows="3" maxlength="500" placeholder="例如：限 NAVO 代購消費使用">限 NAVO 代購消費使用</textarea>
<button id="issueBtn" class="primary">確認新增抵用券</button><div id="couponMsg" class="msg"></div><div id="issueResult" class="result hidden"></div>
</div></section></main>
<script>
const cfg=window.NAVO_LINE_CONFIG||{};const $=id=>document.getElementById(id);let sb=null,session=null,customers=[];
function msg(id,s){$(id).textContent=s||''}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function init(){if(!cfg.SUPABASE_URL||!cfg.SUPABASE_PUBLISHABLE_KEY){msg('loginMsg','請先確認 config.js 已設定 SUPABASE_URL 與 SUPABASE_PUBLISHABLE_KEY。');return}sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);const {data}=await sb.auth.getSession();session=data.session;if(session)await showTool()}
async function login(){msg('loginMsg','登入中⋯');const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg('loginMsg','登入失敗：'+error.message);return}session=data.session;await showTool()}
function optionsHtml(){return '<option value="">請選擇客戶</option>'+customers.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}
async function showTool(){$('loginCard').classList.add('hidden');$('toolCard').classList.remove('hidden');msg('toolMsg','');try{const {data,error}=await sb.from('customers').select('id,name').order('name');if(error)throw error;customers=data||[];$('customerCode').innerHTML=optionsHtml();$('couponCustomer').innerHTML=optionsHtml();$('couponCustomers').innerHTML=customers.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');msg('toolMsg','已登入：'+(session.user.email||''));$('allCount').textContent=`將發送給目前 CRM 客戶清單中的 ${customers.length} 位客戶。`}catch(e){msg('toolMsg','載入客戶失敗：'+e.message);msg('couponMsg','無法載入客戶清單，請檢查登入權限。')}}
async function api(action,payload){const res=await fetch(cfg.SUPABASE_URL+'/functions/v1/navo-line-member',{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.SUPABASE_PUBLISHABLE_KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...payload})});let d={};try{d=await res.json()}catch{}if(!res.ok)throw new Error(d.error||`請求失敗（HTTP ${res.status}）`);return d}
async function makeCode(){const customerId=$('customerCode').value;if(!customerId){msg('toolMsg','請先選擇客戶。');return}const b=$('makeBtn');b.disabled=true;b.textContent='產生中⋯';$('codeResult').classList.add('hidden');try{const d=await api('create-code',{customerId});$('code').textContent=d.code;$('expiry').textContent='到期時間：'+new Date(d.expiresAt).toLocaleString('zh-TW')+'（15 分鐘後失效）';$('codeResult').classList.remove('hidden');msg('toolMsg','已為「'+d.customerName+'」產生驗證碼。')}catch(e){msg('toolMsg',e.message||'產生驗證碼失敗')}finally{b.disabled=false;b.textContent='產生 15 分鐘有效驗證碼'}}
function mode(){const m=document.querySelector('input[name="targetMode"]:checked').value;$('singleWrap').classList.toggle('hidden',m!=='one');$('multipleWrap').classList.toggle('hidden',m!=='multiple');$('allWrap').classList.toggle('hidden',m!=='all')}
async function issueCoupons(){const modeValue=document.querySelector('input[name="targetMode"]:checked').value;let customerIds=[];if(modeValue==='one'){if($('couponCustomer').value)customerIds=[$('couponCustomer').value]}else if(modeValue==='multiple'){customerIds=Array.from($('couponCustomers').selectedOptions).map(o=>o.value)}else{customerIds=customers.map(c=>c.id)}
if(!customerIds.length){msg('couponMsg','請先選擇至少一位會員。');return}const title=$('couponTitle').value.trim();const amount=Number($('couponAmount').value);const minimumSpend=Number($('couponMinimum').value);if(!title){msg('couponMsg','請輸入抵用券名稱。');return}if(!Number.isFinite(amount)||amount<=0){msg('couponMsg','折抵金額必須大於 0。');return}if(!Number.isFinite(minimumSpend)||minimumSpend<0){msg('couponMsg','最低消費不可小於 0。');return}const expiry=$('couponExpiry').value;const today=new Date();const todayLocal=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');if(expiry&&expiry<todayLocal){msg('couponMsg','到期日不可早於今天。');return}
const b=$('issueBtn');b.disabled=true;b.textContent='發券中⋯';$('issueResult').classList.add('hidden');msg('couponMsg','正在新增抵用券，請勿關閉頁面。');try{const d=await api('create-coupons',{customerIds,title,amount,minimumSpend,expiresAt:expiry,note:$('couponNote').value.trim()});$('issueResult').innerHTML=`<b>新增成功</b><p>已發出 ${Number(d.issuedCount)||0} 張「${esc(title)}」。</p><p>對象：${esc((d.customerNames||[]).join('、'))}</p>`;$('issueResult').classList.remove('hidden');msg('couponMsg','完成。會員重新開啟或重新整理 LINE 會員中心後，就會看到有效抵用券。')}catch(e){msg('couponMsg','新增失敗：'+(e.message||'未知錯誤'))}finally{b.disabled=false;b.textContent='確認新增抵用券'}}
document.querySelectorAll('input[name="targetMode"]').forEach(el=>el.addEventListener('change',mode));$('loginBtn').onclick=login;$('makeBtn').onclick=makeCode;$('issueBtn').onclick=issueCoupons;$('logoutBtn').onclick=async()=>{await sb.auth.signOut();session=null;$('toolCard').classList.add('hidden');$('loginCard').classList.remove('hidden')};$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText($('code').textContent);msg('toolMsg','已複製驗證碼。')}catch{msg('toolMsg','請長按驗證碼手動複製。')}};init();
</script></body></html>
