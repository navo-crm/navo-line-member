<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVO 會員綁定碼管理</title><style>:root{--pink:#c96f91;--ink:#332a30;--muted:#847780;--line:#f0dce5}*{box-sizing:border-box}body{margin:0;background:#fff7fa;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.wrap{max-width:620px;margin:auto;padding:22px 16px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0}.logo{letter-spacing:.25em;color:var(--pink);font-weight:800;font-size:12px}h1{font-size:23px;margin:8px 0}p,.muted{font-size:13px;color:var(--muted);line-height:1.6}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:7px 0 14px}button{width:100%;padding:13px;border:0;border-radius:11px;background:var(--pink);color:white;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.hidden{display:none!important}.msg{white-space:pre-wrap;color:var(--muted);font-size:13px;margin-top:10px}.code{font-size:32px;letter-spacing:.18em;font-weight:900;color:#a64d72;text-align:center;padding:18px;background:#fff4f8;border-radius:12px}.warn{color:#a64d35}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><main class="wrap"><div class="logo">N A V O</div><h1>會員綁定碼管理</h1><p>此頁僅供 NAVO 管理員使用。驗證碼有效 15 分鐘、限使用一次，請直接提供給該位客戶，不要貼在公開群組。</p>
<section id="loginCard" class="card"><h2>管理員登入</h2><label>Email</label><input id="email" type="email" autocomplete="username"><label>密碼</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">使用 NAVO CRM 帳號登入</button><div id="loginMsg" class="msg"></div></section>
<section id="toolCard" class="card hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><b>產生一次性驗證碼</b><button id="logoutBtn" style="width:auto;padding:8px 12px;background:#eee;color:#333">登出</button></div><label>選擇 NAVO 客戶</label><select id="customer"><option value="">載入客戶中⋯</option></select><button id="makeBtn">產生 15 分鐘有效驗證碼</button><div id="result" class="hidden"><p>請將以下驗證碼私訊給對應客戶：</p><div id="code" class="code"></div><p id="expiry" class="muted"></p><button id="copyBtn" style="background:#4d8c75">複製驗證碼</button></div><div id="toolMsg" class="msg"></div></section></main>
<script>
const cfg=window.NAVO_LINE_CONFIG||{};const $=id=>document.getElementById(id);let sb=null,session=null;
function msg(id,s){$(id).textContent=s||''}
async function init(){if(!cfg.SUPABASE_URL||!cfg.SUPABASE_PUBLISHABLE_KEY){msg('loginMsg','請先設定 config.js');return}sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);const {data}=await sb.auth.getSession();session=data.session;if(session)await showTool()}
async function login(){msg('loginMsg','登入中⋯');const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg('loginMsg','登入失敗：'+error.message);return}session=data.session;await showTool()}
async function showTool(){ $('loginCard').classList.add('hidden');$('toolCard').classList.remove('hidden');try{const {data,error}=await sb.from('customers').select('id,name').order('name');if(error)throw error;$('customer').innerHTML='<option value="">請選擇客戶</option>'+data.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');msg('toolMsg','已登入：'+(session.user.email||''))}catch(e){msg('toolMsg','載入客戶失敗：'+e.message)}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function makeCode(){const customerId=$('customer').value;if(!customerId){msg('toolMsg','請先選擇客戶。');return}const b=$('makeBtn');b.disabled=true;b.textContent='產生中⋯';$('result').classList.add('hidden');try{const res=await fetch(cfg.SUPABASE_URL+'/functions/v1/navo-line-member',{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.SUPABASE_PUBLISHABLE_KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({action:'create-code',customerId})});const d=await res.json();if(!res.ok)throw new Error(d.error||'產生失敗');$('code').textContent=d.code;$('expiry').textContent='到期時間：'+new Date(d.expiresAt).toLocaleString('zh-TW')+'（15 分鐘後失效）';$('result').classList.remove('hidden');msg('toolMsg','已為「'+d.customerName+'」產生驗證碼。請私訊提供，勿公開分享。')}catch(e){msg('toolMsg',e.message||'產生驗證碼失敗')}finally{b.disabled=false;b.textContent='產生 15 分鐘有效驗證碼'}}
$('loginBtn').onclick=login;$('makeBtn').onclick=makeCode;$('logoutBtn').onclick=async()=>{await sb.auth.signOut();session=null;$('toolCard').classList.add('hidden');$('loginCard').classList.remove('hidden')};$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText($('code').textContent);msg('toolMsg','已複製驗證碼。')}catch{msg('toolMsg','請長按驗證碼手動複製。')}};init();
</script></body></html>
